<div ng-controller="GrafanaIndexController">
    <div class="row">
        <div class="col-md-12">
            <h2>
                <i class="fa fa-bar-chart"></i> Grafana Dashboard
            </h2>
        </div>
    </div>
    
    <div class="row" ng-if="loading">
        <div class="col-md-12" style="text-align: center; padding: 50px;">
            <i class="fa fa-spinner fa-spin fa-3x"></i>
            <p style="margin-top: 20px;">Loading Grafana Dashboard...</p>
        </div>
    </div>
    
    <div class="row" ng-if="error && !loading">
        <div class="col-md-12">
            <div class="alert alert-danger">
                <i class="fa fa-exclamation-triangle"></i>
                <strong>Error:</strong> Failed to load Grafana configuration. Please check your settings.
            </div>
        </div>
    </div>
    
    <div class="row" ng-if="!loading && !error">
        <div class="col-md-12">
            <div class="grafana-container" style="position: relative; width: 100%; height: calc(100vh - 150px); min-height: 600px;">
                <iframe 
                    ng-src="{{grafanaUrl}}" 
                    style="width: 100%; height: 100%; border: 1px solid #ddd; border-radius: 4px;"
                    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation"
                    allowfullscreen>
                </iframe>
            </div>
            <div style="margin-top: 10px; color: #666; font-size: 12px;">
                <i class="fa fa-info-circle"></i> 
                Grafana dashboard embedded from: {{grafanaUrl | limitTo: 50}}...
            </div>
        </div>
    </div>
</div>
